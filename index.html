<title>紫微手牌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 版面：手機單欄 App——上方輸入卡、黏住的分頁列、各分頁一張張卡片；桌機置中最寬 560px */
:root {
  --bg: #f2f3f7; --surface: #ffffff; --ink: #1c2132; --muted: #646b80; --line: #dde0e9;
  --accent: #5a3b8c; --accent-ink: #ffffff; --accent-soft: #ece6f6;
  --gold: #b0841a; --good: #24704c; --good-soft: #e3f2ea; --weak: #b03636; --weak-soft: #f8e5e5; --mid: #7b8092; --mid-soft: #eceef3;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Heiti TC", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11131b; --surface: #1a1d28; --ink: #e7e9f1; --muted: #9ba2b6; --line: #2b2f3e;
  --accent: #b9a0e6; --accent-ink: #17121f; --accent-soft: #2a2340;
  --gold: #e2b84c; --good: #6fcb9c; --good-soft: #17332a; --weak: #f08585; --weak-soft: #3a1f22; --mid: #a3a8b8; --mid-soft: #262a36;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11131b; --surface: #1a1d28; --ink: #e7e9f1; --muted: #9ba2b6; --line: #2b2f3e;
  --accent: #b9a0e6; --accent-ink: #17121f; --accent-soft: #2a2340;
  --gold: #e2b84c; --good: #6fcb9c; --good-soft: #17332a; --weak: #f08585; --weak-soft: #3a1f22; --mid: #a3a8b8; --mid-soft: #262a36;
  color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-top: 6px; }
h1 { font-family: var(--f-display); font-size: 26px; margin: 0; letter-spacing: .04em; }
h1 .star { color: var(--gold); font-size: 18px; vertical-align: 3px; margin-right: 4px; }
.sub { color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
h2 { font-family: var(--f-display); font-size: 18px; margin: 0; }
h3 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
input, select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 76px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > * { min-width: 0; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--bg); color: var(--ink); font: inherit; padding: 10px 0; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn { border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; padding: 12px 16px; cursor: pointer; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.small { padding: 8px 12px; font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.err { color: var(--weak); font-size: 14px; }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; padding: 8px 0; border-radius: 9px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.who { font-size: 14px; color: var(--muted); }
.who b { color: var(--ink); font-size: 16px; }
.flag { background: var(--weak-soft); color: var(--weak); border-radius: 8px; padding: 6px 10px; font-size: 14px; }
/* 家長卡 */
.q { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.q:last-child { border-bottom: 0; }
.q p { margin: 0; }
.q .num { color: var(--accent); font-weight: 700; margin-right: 4px; font-variant-numeric: tabular-nums; }
.yn { display: flex; gap: 8px; }
.yn button { flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 8px 0; font: inherit; cursor: pointer; }
.yn button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.verdict { border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.no { background: var(--weak-soft); color: var(--weak); }
.verdict.wait { background: var(--mid-soft); color: var(--muted); }
.stars { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; row-gap: 6px; align-items: center; }
.stars .s { color: var(--gold); letter-spacing: 2px; font-size: 17px; white-space: nowrap; }
.hl { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.act { border-left: 3px solid var(--gold); padding: 2px 0 2px 12px; }
.act small { display: block; color: var(--muted); font-size: 14px; margin-top: 4px; }
details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
pre.key { white-space: pre-wrap; font-family: inherit; font-size: 14px; background: var(--bg); border-radius: 10px; padding: 10px 12px; margin: 8px 0 0; }
/* 手牌 */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 18px; white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
.pal { display: grid; grid-template-columns: 4.6em 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pal:last-child { border-bottom: 0; }
.pal .nm { font-weight: 700; }
.pal .nm small { color: var(--muted); font-weight: 400; margin-left: 2px; }
.bar { position: relative; height: 8px; background: var(--mid-soft); border-radius: 4px; }
.bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.sc { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 3.6em; text-align: right; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 7px; margin-left: 6px; }
.g-好 { background: var(--good-soft); color: var(--good); } .g-中 { background: var(--mid-soft); color: var(--mid); } .g-弱 { background: var(--weak-soft); color: var(--weak); }
.pal .det { grid-column: 2 / 4; font-size: 14px; color: var(--muted); min-width: 0; }
.pal .det .st { color: var(--ink); }
.pal .det .hua { color: var(--accent); margin-left: 6px; }
.tag { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin: 4px 4px 0 0; }
/* 應對表 */
.yr { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.yr:last-child { border-bottom: 0; }
.yr .t { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.yr .t b { font-size: 17px; font-variant-numeric: tabular-nums; }
.yr .t span { color: var(--muted); font-size: 13px; }
.mv { display: grid; grid-template-columns: 2em 1fr; gap: 8px; align-items: start; }
.seal { width: 2em; height: 2em; border-radius: 6px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; }
.seal.lu { background: var(--good-soft); color: var(--good); } .seal.ji { background: var(--weak-soft); color: var(--weak); }
.mv .a { font-weight: 700; }
.mv small { color: var(--muted); }
.red { background: var(--weak); color: var(--surface); border-radius: 6px; padding: 1px 8px; font-size: 13px; font-weight: 700; }
.note { color: var(--muted); font-size: 13px; }
#pOut { min-height: 220px; font-size: 13px; }
footer { color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
@media (prefers-reduced-motion: no-preference) { .fade { animation: f .25s ease-out; } @keyframes f { from { opacity: .4; } to { opacity: 1; } } }
</style>

<div class="wrap">
  <header>
    <h1><span class="star">★</span>紫微手牌</h1>
    <span class="sub">三合派｜手機版</span>
  </header>

  <form class="card" id="f" novalidate>
    <div>
      <label for="nm">名字（也用來記住最近查過的人）</label>
      <input id="nm" autocomplete="off" value="範例（虛構生日）">
    </div>
    <div class="grid2">
      <div><label for="bd">國曆生日</label><input id="bd" type="date" min="1901-01-01" max="2099-12-31" value="2000-01-01"></div>
      <div><label for="bt">出生時間（鐘錶時間）</label><input id="bt" type="time" value="12:00"></div>
    </div>
    <div class="grid2">
      <div><label id="sexL">性別</label>
        <div class="seg" role="group" aria-labelledby="sexL"><button type="button" id="sexM" aria-pressed="true">男</button><button type="button" id="sexF" aria-pressed="false">女</button></div></div>
      <div><label for="y0">應對表從哪年起（看 5 年）</label><input id="y0" type="number" inputmode="numeric" min="1901" max="2150"></div>
    </div>
    <button class="btn" id="go" type="submit">排盤</button>
    <div class="err" id="err" hidden></div>
    <div id="recentBox" hidden><label>最近查過</label><div class="chips" id="recent"></div></div>
  </form>

  <nav class="tabs" role="tablist" aria-label="結果分頁">
    <button role="tab" id="t-card" aria-selected="true" aria-controls="p-card">家長卡</button>
    <button role="tab" id="t-hand" aria-selected="false" aria-controls="p-hand">手牌</button>
    <button role="tab" id="t-year" aria-selected="false" aria-controls="p-year">應對表</button>
    <button role="tab" id="t-prompt" aria-selected="false" aria-controls="p-prompt">報告</button>
  </nav>

  <div class="who card" id="who"></div>

  <section id="p-card" role="tabpanel" aria-labelledby="t-card" class="card fade"></section>
  <section id="p-hand" role="tabpanel" aria-labelledby="t-hand" class="card fade" hidden></section>
  <section id="p-year" role="tabpanel" aria-labelledby="t-year" class="card fade" hidden></section>
  <section id="p-prompt" role="tabpanel" aria-labelledby="t-prompt" class="card fade" hidden>
    <h2>紫微報告 prompt</h2>
    <p class="note" style="margin:0">填完按「產生」，複製後到 Claude 開新對話貼上送出。八字 prompt 目前請用電腦版。</p>
    <div><label for="pl">出生地（換算真太陽時）</label><select id="pl"></select></div>
    <div><label for="si">目前身分與處境</label><input id="si" placeholder="例：40 歲上班族，兩個小孩，正在考慮轉職"></div>
    <div><label for="ev">過去大事，一行一件（可留空）</label><textarea id="ev" placeholder="例：2012 考上郵局"></textarea></div>
    <div><label for="qq">想問的問題，1–3 個（可留空）</label><textarea id="qq"></textarea></div>
    <div class="grid2">
      <div><label id="mdL">報告模式</label><div class="seg" role="group" aria-labelledby="mdL"><button type="button" id="mdA" aria-pressed="true">A 完整</button><button type="button" id="mdB" aria-pressed="false">B 回顧</button></div></div>
      <div><label id="fsL">第一份報告？</label><div class="seg" role="group" aria-labelledby="fsL"><button type="button" id="fsY" aria-pressed="true">是</button><button type="button" id="fsN" aria-pressed="false">否</button></div></div>
    </div>
    <label class="row" for="hd" style="color:var(--ink);font-size:15px"><input id="hd" type="checkbox" checked style="width:auto"> 附上手牌十二宮強弱分數</label>
    <button class="btn" id="pGo" type="button">產生</button>
    <textarea id="pOut" readonly hidden aria-label="產生的 prompt"></textarea>
    <div class="row" id="pAct" hidden><button class="btn small" id="pCopy" type="button">複製全文</button><span class="note" id="pMsg"></span></div>
    <p class="note" style="margin:0">手機版資料區與電腦版相同，只是雜曜只列 23 顆（電腦版 42 顆）。</p>
  </section>

  <footer>
    <div>所有計算都在這支手機的瀏覽器裡完成，生日資料不會上傳。分數是用來排步調、找要補強的地方，不是預測。</div>
    <details><summary>怎麼放到手機桌面</summary>
      <div style="margin-top:6px">iPhone：用 Safari 打開這個連結 → 下方「分享」→「加入主畫面」。<br>Android：用 Chrome 打開 → 右上角「⋮」→「加到主畫面」。</div>
    </details>
  </footer>
</div>

中土", "天上火", "石榴木", "大海水"], "ZIWEI_PROMPT": "你是一位資深的八字／紫微斗數解讀者，服務對象是付費諮詢的一般民眾。\n你的專業風格是：務實、具體、可執行，說人話，不用宿命論的語言，\n也不誇大自己能算到的範圍。\n\n## 絕對禁令（違反任何一條即為不合格輸出）\n\n1. 不得自行排盤或推算干支、宮位、起運歲數、大運順逆、流年干支。\n   你只能使用下方提供的資料。\n2. 不得預測死亡、重大疾病、壽命、意外。健康只談體質傾向與作息建議。\n3. 不得提供具體投資標的、買賣時機、金額建議。\n4. 不得使用恐嚇性語言。\n5. 不得推銷任何法事、開運物、改運服務。\n6. 不得使用絕對化斷語（「一定會」「注定」「必然」），改用傾向性描述。\n7. 不得為了讓報告看起來完整，而補上資料不支持的內容。\n8. 不得將任何一步大運／大限標記為「好運」或「壞運」。\n   那是環境，不是吉凶。要描述「這是什麼樣的環境」與「該怎麼走」。\n9. 不得預言具體災禍的發生年份。可談環境特性與該留意什麼，不得指認事件。\n\n## ★★ 白話化規則（最高優先，與其他規則衝突時以本規則為準）\n\n讀者是完全沒學過命理的零基礎高中生。他願意讀，但沒義務查任何一個詞。\n\n**規則 1｜括號隔離**\n正文用純白話寫完整，盤面依據只能放句末括號當註腳。\n驗收：刪掉全文所有括號後，文章必須仍然完整通順、意思不變。\n\n**規則 2｜正文禁用詞**\n以下只能出現在括號內：化祿、化權、化科、化忌、三方四正、空宮、煞星、祿存、\n羊陀火鈴、日主、月令、所有十神名稱、通根、藏干、旺衰、身強身弱、沖、刑、克、\n合、會照、所有格局名稱。\n「大限／大運」正文改寫為時間本身（「2020 到 2029 這十年」）。\n宮位名稱正文改白話（事業宮→工作這一塊）。\n\n**規則 3｜禁止翻譯式寫法**\n不得寫「你有天梁星（天梁是穩重的星）」。正文根本不要提那個名詞，\n直接講它在生活裡長什麼樣子。\n\n**規則 4｜抽象形容換成具體場景**\n不寫「你個性內斂不擅爭取」，要寫「開會時你通常等別人講完才開口，\n事情做完也不太主動說是自己做的」。\n每個特質描述都要能讓客戶想起一個真實發生過的場景。\n\n**規則 5｜反向護欄：白話不等於空泛**\n每個論斷都要通過測試：換到另一個陌生人身上還成立嗎？成立就是太籠統，重寫。\n具體度只能提高，不能下降。\n\n**規則 6｜比喻之後必須接實例**\n只有比喻沒有實例，等於沒說。\n\n## 論斷依據規則\n\n每一個論斷，句末必須以括號標出盤面依據，且須符合白話化規則 1。\n沒有盤面依據的論斷，一律不得寫出。\n\n## ★ 大運與流年的解讀規則\n\n**A. 大運是環境，不是評分**\n判斷依據是大運干支與本命的互動關係，不是大運本身的字面吉凶。\n\n**B. 天干與地支分開講**\n天干偏外顯環境與機會形式，地支偏內在根基與實質得失，通常影響更深。\n一般前五年天干作用明顯、後五年地支明顯（傾向而非鐵律）。\n\n**C. 交運期**\n大運交接前後約一年常有明顯變動。若客戶正處交運期，必須主動點出。\n\n**D. 流年是觸發器**\n流年只能觸發大運已鋪好的環境，不得脫離大運單獨論流年。\n\n**E. 回測優先（最重要）**\n若提供了「客戶過去大事」，必須先回測再談未來：\n逐一對照事件當時的大運流年 → 說明那個環境為何容易導向這類事件 →\n誠實評估吻合度。**對不上的必須明說對不上，不得硬凹。**\n\n**F. 缺時辰時**\n大運照常解讀，註明起運歲數約有 ±4 個月誤差。\n若某事件落在兩步大運交界附近，須說明歸屬需視精確時辰而定。\n\n## ★ 資料完整度分支\n\n本次資料完整度：{{完整 / 缺時辰 / 只知大概時段}}\n\n若為「缺時辰」：\n- 可讀：日主與月令的關係、年月柱十神、日支配偶宮、三柱生剋、大運流年\n- 不可讀：任何時柱依據的論斷、子女細節、晚年細部、全部紫微宮位\n- 旺衰若落在臨界，必須並列兩種可能並各自給建議，不得擅自選一\n- 第一段結尾加入範圍說明，語氣專業不道歉\n\n## ★ 輸出模式選擇\n\n本次模式：{{模式A 完整分析版 / 模式B 生命回顧敘事版}}\n是否為該客戶首次報告：{{是 / 否}}\n\n模式 B 需要完整時辰。若缺時辰，不得輸出模式 B，\n改回覆「此模式需要出生時辰，建議改用完整分析版」。\n\n模式 B 的段 2、3、4 所指認的人生階段，**必須以客戶自述的過去大事為準**。\n若客戶未提供，改寫為推測語氣並明白標示，嚴禁自行認定客戶哪段人生過得好或不好。\n\n---\n\n### 【模式 A】完整分析版．七段．3000-4000 字（缺時辰 2500-3200 字）\n\n**一、盤面速覽與本次解讀範圍**（約 350 字）\n客觀陳述，讓客戶確認資料無誤。缺時辰者附範圍說明。\n\n**二、你的核心三特質**（約 550 字）\n每項：一句話結論 → 為什麼 → 生活中的具體例子。\n\n**三、你的優勢，以及怎麼用在對的地方**（約 450 字）\n明確指出哪類環境放大它、哪類浪費它。\n\n**四、你的卡點，以及怎麼繞過去**（約 450 字）\n每個卡點必須配一個具體替代做法。\n\n**五、你的人生節奏**（約 900 字，本報告重心）\n5-1 回測：對照過去大事與當時環境，誠實評估吻合度\n5-2 你現在在哪：目前這十年的環境特性、還剩幾年、是否正在轉換期\n5-3 下一步：下一個十年的轉向，現在該預先準備什麼\n\n**六、針對你的提問**（約 700 字）\n逐題回應，每題同時扣住本命與目前這十年。\n\n**七、未來 12 個月的三個具體行動**（約 350 字）\n每項要有「做什麼」「什麼時候」「怎麼判斷有沒有效」。\n\n---\n\n### 【模式 B】生命回顧敘事版．八段．1800-2500 字\n\n**段 0 ─ 一句聲明**（僅首次報告出現）\n最多兩句。命盤講的是傾向與環境，不是判決。不得道歉、不得寫成免責條款。\n\n**段 1 ─ 基本資料與人生階段序列**（約 250 字）\n列出各階段的年齡與西元年份、標記現在所在階段。\n本段不做任何解讀，一句評價都不能有。\n\n**段 2 ─【順境段】**（約 350 字）\n依序回答三問：為什麼那時候好 → 那份順利是從哪裡來的 → 為什麼沒守住。\n來源必須明確指出。第三問是重點：通常那份資源是那十年借給他的，不是本來就有的，\n時間一過就收回去了。\n\n**段 3 ─【失焦段】**（約 300 字）\n依序回答：那幾年重心該放在哪一塊 → 那一塊當時被什麼卡住。\n不得暗示客戶當年做錯選擇，寫成「當時的結構讓那一塊特別難施力」。\n\n**段 4 ─【低潮段】**（約 350 字）\n指認年份 → 說明那個結構在生活裡長成什麼樣子（使不上力、努力沒回饋、\n方向感消失）→ 說明同樣的努力放在別的階段結果會不同，差別在環境不在能力。\n每句都要有括號依據。不得替客戶下「這不是你的錯」的結論，\n把事實攤開讓他自己得出。不得延伸為「所以不用檢討」。\n\n**段 5 ─【現在這十年】**（約 400 字）\n現在被啟動的是什麼 → 至少三個這個月能開始的具體動作。\n建議必須從被啟動的結構推導，不得是通用勵志語。\n\n**段 6 ─【只講一條】**（約 180 字）\n**嚴格只寫一條**要避開的事。選最容易讓他重蹈段 3、段 4 覆轍的那一件。\n要具體到能當場辨認。不得恐嚇。\n\n**段 7 ─ 一句非命理的話**（一句，最多兩句）\n完全不使用命理術語，連括號都不要。不說教、不勵志口號。\n指向他這些年扛著的某個自我譴責，說明那不屬於他。\n必須具體到換一個人身上就不成立。\n\n**段 8 ─ 一個落地的下一步提議**（約 120 字）\n一個，不是清單。小到本週能做完，且有明確完成判準。\n\n---\n\n## 資料區\n\n**命盤資料**\n{{三柱或四柱干支、十神、藏干；或紫微十二宮主星、四化、三方四正}}\n\n**大運／大限資料**\n{{起運歲數、順逆、各步干支與對應年齡及西元年份、現行標記、今年與明年流年}}\n\n**客戶基本資訊**\n- 性別：{{性別}}\n- 目前年齡：{{年齡}}\n- 出生時段（若知道）：{{清晨／上午／中午／下午／傍晚／晚上／半夜／完全不知}}\n- 目前身分與處境：{{例：40歲上班族，兩個小孩，正在考慮轉職}}\n\n**客戶過去大事（用於回測，可留空）**\n{{年份＋事件，3-5 件}}\n\n**客戶提問**\n{{1-3 個問題}}\n\n---\n\n## 文末固定附上（原文照抄）\n\n「本報告為命理性質的自我探索參考，不構成醫療、法律、投資、婚姻或任何專業建議。\n您的人生決定權完全在您自己手上。」\n\n（若括號內術語超過 10 個，可在免責聲明前加一個「如果你想知道那些括號在講什麼」\n的小附錄，每個詞一句話解釋。此附錄不得作為正文使用術語的藉口。）\n\n---\n\n## 交付前自我檢查（逐條確認，任一未過就重寫）\n\n**白話化**\n- [ ] 把全文所有括號刪掉，文章還完整通順嗎？\n- [ ] 正文（括號外）有沒有出現任何禁用詞？\n- [ ] 有沒有「名詞＋解釋」的翻譯式寫法？\n- [ ] 特質描述是具體場景，還是抽象形容詞？\n- [ ] 每個論斷換到陌生人身上還成立嗎？成立即太籠統，重寫。\n\n**準確性**\n- [ ] 每個論斷都有括號依據？\n- [ ] 有沒有把任何一段時期寫成「好運／壞運」？\n- [ ] 有沒有預言具體災禍年份？\n- [ ] 回測時，對不上的有沒有誠實說對不上？\n- [ ] 缺時辰時，是否完全沒有引用時柱？\n\n**模式 B 專用**\n- [ ] 段 1 是否完全沒有解讀？\n- [ ] 段 2 的「為什麼沒守住」有沒有真的回答？\n- [ ] 段 2/3/4 指認的年份，是否來自客戶自述？\n- [ ] 段 6 是否**只有一條**？\n- [ ] 段 7 是否零術語、零括號？換一個人身上還成立嗎？（成立即失敗）\n- [ ] 段 8 是否只有一個動作，且本週做得完？"};

    if (dx) { dstem = palaceStem(yg, dx.b); luck.push(`  大限四化：${SIHUA[dstem].map((s, i) => s + "化" + "祿權科忌"[i]).join("、")}`); }
    const ly = {}; for (const b of BR) ly[b] = [];
    const layers = [["年", lg, lb]]; if (dx) layers.push(["大", dstem, dx.b]);
    for (const [tg, st, br] of layers) {
      const lc = LUCUN[st], [kui, yue] = KUI_YUE[st], luan = BR[mod(3 - bi(br), 12)];
      for (const [nm, b] of [["祿", lc], ["羊", mv(lc, 1)], ["陀", mv(lc, -1)], ["昌", LIUCHANG[st]], ["曲", LIUQU[st]], ["魁", kui], ["鉞", yue], ["馬", TIANMA(br)], ["鸞", luan], ["喜", mv(luan, 6)]]) ly[b].push(tg + nm);
    }
    luck.push("  流曜：" + [...BR].filter(b => ly[b].length).map(b => `${pal(b)}：${ly[b].join("、")}`).join("；"));
    const dj = mod(bi(lb) + ziDou, 12);
    luck.push("  流月：" + MONTHN.map((n, i) => `${n}在${pal(BR[(dj + i) % 12])}`).join("、"));
  }
  return [L.join("\n"), luck.join("\n")];
}
function handText(y, m, d, h, mi, male, lon, thisYear) {
  const { ctx } = chartOf(y, m, d, h, mi, male, lon), H = roleHand(ctx.pals, ctx.ming), gj = detectGeju(ctx.ming, ctx.pals);
  const order = sortedRoles(H), sgn = sgn1;
  const L = ["**手牌系統：本命十二宮相對強弱（本系統自訂評分）**",
    "使用方式：分數是用固定規則（三方四正加權、四化、格局、星性修正）算出的相對強弱，只用來找出「哪幾塊生活比較有底氣、哪幾塊要多花力氣補」，可作為第三、四段（優勢、卡點）的輔助依據。此分數未通過事件預測的統計驗證：不得用來判斷任何時期吉凶、不得據以預言事件；與盤面其他資料矛盾時以盤面為準。分數本身屬術語，正文不得出現，只能放括號。",
    "（好 = 前段、中 = 中段、弱 = 後段；12 宮依分數由高到低）",
    ...order.map(r => `- ${r}（${H[r][1]}）${sgn(H[r][0])}　${lgrade(H[r][0], "本命")}`),
    `12 宮合計 ${sgn(sum(Object.values(H).map(x => x[0])))}；命格總分 ${sgn(H["命宮"][0] + gejuBonus(gj))}；格局：${gj.map(([n, k]) => `${n}（${k}）`).join("、") || "無"}`,
    `相對最強（可借力）：${order.slice(0, 2).join("、")}；相對最弱（需補強）：${order.slice(-2).join("、")}`,
    "今明兩年祿忌落點（只標落在本命哪一塊生活，不代表吉凶）："];
  for (const yy of [thisYear, thisYear + 1]) {
    const D = daxianHand(ctx, yy), Y = yearHand(ctx, yy), yc = yearCard(ctx, yy);
    const nb = (H2, k) => natalRole(ctx, H2.hua.find(x => x[0] === k)[2]);
    L.push(`- ${yy}：十年祿在本命${nb(D, "祿")}、十年忌在本命${nb(D, "忌")}；當年祿在本命${nb(Y, "祿")}、當年忌在本命${nb(Y, "忌")}` +
      (yc.ji2.length ? `；當年忌與本命或十年忌落同一宮：${yc.ji2.map(([a, b]) => `${a}（${b}）`).join("、")}` : ""));
  }

}
function fill(block, values) {

}
function prompt(p) {

    "三柱或四柱干支、十神、藏干；或紫微": chart, 四柱或三柱干支: chart, 起運歲數: luck, 性別: p.gender, 年齡: `${age} 歲`,
    "清晨／": `已知確切時間 ${p.btime}`, "例：40歲": p.situation || "（未提供）", "年份＋事件": p.events || "（未提供）",
    "1-3 個問題": p.questions || "（未提供，請依盤面重點解讀）" };

const API = { hand, card, prompt, ziweiText, handText, chartOf, trueSolar, solarToLunar, pyRound };

<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const PLACES = [["台北",121.56],["新北",121.47],["基隆",121.74],["桃園",121.30],["新竹",120.97],["苗栗",120.82],["台中",120.68],["彰化",120.54],["南投",120.68],["雲林",120.53],["嘉義",120.45],["台南",120.21],["高雄",120.31],["屏東",120.49],["宜蘭",121.75],["花蓮",121.60],["台東",121.15],["澎湖",119.57],["金門",118.32]];
  $("pl").innerHTML = PLACES.map(([n, l]) => `<option value="${l}"${n === "台中" ? " selected" : ""}>${n}</option>`).join("");
  $("y0").value = new Date().getFullYear();

  const seg = (a, b) => { $(a).onclick = () => { $(a).setAttribute("aria-pressed", "true"); $(b).setAttribute("aria-pressed", "false"); };
                          $(b).onclick = () => { $(b).setAttribute("aria-pressed", "true"); $(a).setAttribute("aria-pressed", "false"); }; };
  seg("sexM", "sexF"); seg("mdA", "mdB"); seg("fsY", "fsN");
  const male = () => $("sexM").getAttribute("aria-pressed") === "true";

  // 分頁
  const TABS = ["card", "hand", "year", "prompt"];
  function show(t) { TABS.forEach(x => { $("t-" + x).setAttribute("aria-selected", x === t); $("p-" + x).hidden = x !== t; }); store.set("zw.tab", t); }
  TABS.forEach(x => $("t-" + x).onclick = () => show(x));

  let cur = null, answers = [];
  function read() {
    const name = $("nm").value.trim() || "未命名", bd = $("bd").value, bt = $("bt").value, y0 = parseInt($("y0").value, 10);
    if (!bd) throw new Error("請填國曆生日。");
    if (!bt) throw new Error("請填出生時間；紫微斗數一定要有時辰。");
    const [y, m, d] = bd.split("-").map(Number), [h, mi] = bt.split(":").map(Number);
    if (y < 1901 || y > 2099) throw new Error("生日年份請在 1901 到 2099 之間。");
    if (!(y0 >= 1901 && y0 <= 2150)) throw new Error("應對表起始年請填 4 位數年份。");
    return { name, y, m, d, h, mi, male: male(), y0 };
  }
  function run() {
    $("err").hidden = true;
    let p;
    try { p = read(); } catch (e) { $("err").textContent = e.message; $("err").hidden = false; return; }
    try {
      const H = ZW.hand(p.name, p.y, p.m, p.d, p.h, p.mi, p.male, p.y0, p.y0 + 4);
      const C = ZW.card(p.name, p.y, p.m, p.d, p.h, p.mi, p.male);
      cur = { p, H, C }; answers = Array(C.qs.length).fill(null);
      renderWho(); renderCard(); renderHand(); renderYear();
      $("pOut").hidden = true; $("pAct").hidden = true;
      remember(p);
    } catch (e) { $("err").textContent = "排盤失敗：" + e.message; $("err").hidden = false; }
  }
  $("f").addEventListener("submit", e => { e.preventDefault(); run(); });

  // 最近查過（只存在這支手機）
  function remember(p) {
    if (p.name.startsWith("範例")) return;
    const list = store.get("zw.recent", []).filter(x => x.name !== p.name);
    list.unshift({ name: p.name, bd: $("bd").value, bt: $("bt").value, male: p.male });
    store.set("zw.recent", list.slice(0, 8)); renderRecent();
  }
  function renderRecent() {
    const list = store.get("zw.recent", []);
    $("recentBox").hidden = !list.length;
    $("recent").innerHTML = list.map((x, i) => `<button type="button" class="chip" data-i="${i}">${esc(x.name)}</button>`).join("");
    $("recent").querySelectorAll("button").forEach(b => b.onclick = () => {
      const x = list[+b.dataset.i]; $("nm").value = x.name; $("bd").value = x.bd; $("bt").value = x.bt;
      (x.male ? $("sexM") : $("sexF")).click(); run();
    });
  }

  function renderWho() {
    const { H, p } = cur;
    $("who").innerHTML = `<div><b>${esc(p.name)}</b>　${p.y}/${p.m}/${p.d} ${String(p.h).padStart(2, "0")}:${String(p.mi).padStart(2, "0")}（${p.male ? "男" : "女"}）</div>
      <div>真太陽時 ${H.solar}　${esc(H.head)}</div>` +
      (H.flags.length ? `<div class="flag">注意：${esc(H.flags.join("、"))}。時辰或日界可能有爭議，建議再確認出生時間。</div>` : "");
  }

  function renderCard() {
    const C = cur.C, el = $("p-card");
    el.innerHTML = `<h2>${esc(cur.p.name)}的家長卡</h2>
      <div><h3>一、先請家長回答</h3>${C.qs.map((q, i) => `<div class="q"><p><span class="num">${i + 1}.</span>${esc(q[0])}</p>
        <div class="yn" role="group" aria-label="第 ${i + 1} 題"><button type="button" data-i="${i}" data-v="像" aria-pressed="false">像</button><button type="button" data-i="${i}" data-v="不像" aria-pressed="false">不像</button></div></div>`).join("")}</div>
      <div class="verdict wait" id="vd">5 題都回答後，這裡會顯示有沒有對上。</div>
      <div><h3>二、能力星等</h3><p class="note" style="margin:2px 0 8px">不是好壞，是哪裡比較自然、哪裡要多陪。</p>
        <div class="stars">${C.stars.map(([l, n]) => `<span class="s" aria-label="${n} 顆星">${"★".repeat(n)}${"☆".repeat(5 - n)}</span><span>${esc(l)}</span>`).join("")}</div></div>
      <div class="hl">最亮的地方：<b>${esc(C.top.join("、"))}</b><br>相對要多陪的地方：<b>${esc(C.low.join("、"))}</b></div>
      <div><h3>三、今天就能做的一件事</h3><div class="act" style="margin-top:6px">${esc(C.act)}<small>怎麼知道有沒有效：${esc(C.check)}</small></div></div>
      <div class="row"><button class="btn small" type="button" id="cCopy">複製給家長（LINE 用）</button><span class="note" id="cMsg"></span></div>
      <details><summary>對照答案（只給你看）</summary><pre class="key">${esc(C.key)}</pre></details>`;
    el.querySelectorAll(".yn button").forEach(b => b.onclick = () => {
      const i = +b.dataset.i; answers[i] = b.dataset.v;
      b.parentNode.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));

  function verdict() {

    const hit = C.qs.slice(0, 4).filter((q, i) => answers[i] === q[1]).length, rev = answers[4] === "不像";
    const all = answers.every(a => a === "像");

    else if (all) { vd.className = "verdict no"; vd.textContent = "5 題都答「像」，代表描述可能太籠統，這次不算對上；請以家長舉的實際例子為準。"; }
    else { vd.className = "verdict no"; vd.textContent = `對不太上：前 4 題 ${hit} 題相符，反向題答「${answers[4]}」。可以先問家長哪幾題不像、舉個例子，再確認出生時間。`; }

    el.innerHTML = `<h2>本命十二宮</h2>
      <div class="stats">
        <div class="stat"><div class="k">好／中／弱</div><div class="v">${H.count["好"]}／${H.count["中"]}／${H.count["弱"]}</div></div>
        <div class="stat"><div class="k">12 宮合計</div><div class="v">${sgn(H.total)}</div></div>
        <div class="stat"><div class="k">命格總分</div><div class="v">${sgn(H.mingge)}</div></div>
      </div>
      <div class="note">格局：${esc(H.geju.join("、") || "無")}　｜　長條往右是有底氣、往左是要補強（滿格 ±6）</div>
      <div>${H.rows.map(r => `<div class="pal">
        <span class="nm">${r.role}<small>${r.br}</small></span>
        <div class="bar" aria-hidden="true">${bar(r.score)}</div>
        <span class="sc">${sgn(r.score)}<span class="pill g-${r.grade}">${r.grade}</span></span>
        <div class="det"><span class="st">${esc(r.stars)}</span>${r.hua ? `<span class="hua">${esc(r.hua)}</span>` : ""}<span>　［${esc(r.cs)}］</span>
          <div>${r.tags.map(([t, m]) => `<span class="tag">${esc(t)}：${esc(m)}</span>`).join("")}${r.luma ? `<span class="tag" style="border-color:var(--gold)">★祿馬交馳：動中得財</span>` : ""}</div></div>
      </div>`).join("")}</div>
      <p class="note" style="margin:0">雜曜與長生十二神只作標籤，不計分。</p>`;
  }
  function renderYear() {
    const H = cur.H, el = $("p-year");
    const line = (k, d) => `<div class="mv"><span class="seal ${k === "祿" ? "lu" : "ji"}">${k}</span><div><span class="a">${esc(d.act)}</span><br>
      <small>落在本命${esc(d.natal)}（這一年的${esc(d.role)}）${sgn(d.score)}<span class="pill g-${d.grade}">${d.grade}</span></small></div></div>`;
    el.innerHTML = `<h2>${cur.p.y0}–${cur.p.y0 + 4} 應對表</h2>
      <div class="hl">本命王牌（遇到難關可以借力）：<b>${esc(H.aces.join("、"))}</b></div>
      <div>${H.years.map(y => `<div class="yr"><div class="t"><b>${esc(y.label)}</b><span>大限 ${esc(y.dx)}</span></div>

  function copy(text, msg, area) {
    const fallback = () => {
      let t = area; if (!t) { t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); }
      t.hidden = false; t.focus(); t.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
